<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Hailey Heiwig</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Hailey Heiwig</a>
      <ul class="nav-links">
        <li><a href="gallery.html">Work</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="contact" style="padding-top:8rem;">
    <h2>Get in Touch</h2>
    <p>For custom sets, press-on inquiries, product requests, or sponsorships.</p>
    <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <select name="inquiry_type" id="inquiry_type">
        <option value="custom">Custom Set Request</option>
        <option value="presson">Press-On Inquiry</option>
        <option value="sponsorship">Sponsorship / Collaboration</option>
        <option value="other">Other</option>
      </select>
      <textarea name="message" placeholder="Tell me about what you’re looking for..." rows="5" required></textarea>
      <button type="submit" class="btn primary">Send Message</button>
    </form>
    <div class="socials">
      <p>Follow the work</p>
      <!-- Update these with actual accounts -->
      <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://tiktok.com/" target="_blank" rel="noopener">TikTok</a>
      <a href="https://pinterest.com/" target="_blank" rel="noopener">Pinterest</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Hailey Heiwig. Wearable art.</p>
  </footer>
  <script>
    // Pre-select inquiry type from URL param
    const params = new URLSearchParams(window.location.search);
    const type = params.get('inquiry');
    if (type) {
      const select = document.getElementById('inquiry_type');
      if (select) select.value = type;
    }
  </script>
</body>
</html>
